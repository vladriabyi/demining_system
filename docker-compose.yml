services:

  # ── База даних з PostGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER:     demining
      POSTGRES_PASSWORD: demining_pass
      POSTGRES_DB:       demining_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U demining -d demining_db"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── Mailpit — локальний SMTP-перехоплювач для розробки ──────────────────────
  # Web UI: http://localhost:8025  |  SMTP: mailpit:1025 (всередині docker network)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP (доступний з хоста для відлагодження)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY:     1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── FastAPI бекенд ───────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:                postgresql+asyncpg://demining:demining_pass@db:5432/demining_db
      SECRET_KEY:                  supersecretkey_change_in_production
      ALGORITHM:                   HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      # SMTP → Mailpit (для production замінити на реальний SMTP)
      SMTP_HOST:                   mailpit
      SMTP_PORT:                   1025
      SMTP_USER:                   demining
      SMTP_PASSWORD:               dev
      SMTP_FROM:                   "Demining System <no-reply@demining.local>"
      SMTP_TLS:                    "false"
      FRONTEND_URL:                http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── React фронтенд (Vite dev server) ────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # volume mount для hot-reload — зміни у src/ одразу відображаються
      - ./frontend/src:/app/src
    depends_on:
      - backend
    # змінна потрібна для Vite щоб не кешував неправильний хост
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pg_data:
